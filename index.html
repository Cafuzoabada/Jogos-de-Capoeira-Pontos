<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puntuación Jogos de Capoeira</title>
  <link rel="stylesheet" href="./style.css">

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#28a745">

  <!-- iOS (Safari no usa el manifest para algunos ajustes) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Jogos Capoeira">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
</head>
<body>
  <div class="container">
    <h1>Puntuación del Campeonato</h1>

    <!-- ── Sección 1: Generador de parejas ─────────────────────────── -->
    <section class="section-card">
      <h2>Generar Parejas</h2>

      <div class="pg-controls">
        <div class="field-group">
          <label for="pg-category">Categoría:</label>
          <select id="pg-category">
            <option value="A Femenino">A Femenino</option>
            <option value="A Masculino">A Masculino</option>
            <option value="B Femenino">B Femenino</option>
            <option value="B Masculino">B Masculino</option>
            <option value="C Femenino">C Femenino</option>
            <option value="C Masculino">C Masculino</option>
            <option value="D Femenino">D Femenino</option>
            <option value="D Masculino">D Masculino</option>
            <option value="E Mezclado">E Mezclado</option>
            <option value="Baobá Femenino">Baobá Femenino</option>
            <option value="Baobá Masculino">Baobá Masculino</option>
            <option value="Juvenil Femenino">Juvenil Femenino</option>
            <option value="Juvenil Masculino">Juvenil Masculino</option>
            <option value="Infantil">Infantil</option>
            <option value="General">General</option>
          </select>
        </div>

        <div class="field-group">
          <label for="pg-stage">Fase:</label>
          <select id="pg-stage">
            <option value="Eliminatorias">Eliminatorias</option>
            <option value="Octavas">Octavas</option>
            <option value="Semifinales">Semifinales</option>
            <option value="Finales">Finales</option>
          </select>
        </div>
      </div>

      <label for="competitorList">Competidores (uno por línea, en orden de seed):</label>
      <textarea
        id="competitorList"
        rows="6"
        placeholder="Nombre 1&#10;Nombre 2&#10;Nombre 3&#10;Nombre 4&#10;Nombre 5"
      ></textarea>

      <button id="generatePairsBtn">Generar Parejas</button>

      <div id="pairsContainer"></div>
    </section>

    <!-- ── Sección 2: Formulario de puntuación ──────────────────────── -->
    <section class="section-card">
      <h2>Puntuación del JOGO</h2>
      <form id="scoreForm">

        <label for="competitor1">Competidor 1:</label>
        <input type="text" id="competitor1" name="competitor1" required>

        <label for="competitor2">Competidor 2:</label>
        <input type="text" id="competitor2" name="competitor2" required>

        <label for="category">Categoría:</label>
        <select id="category" name="category" required>
          <option value="A Femenino">A Femenino</option>
          <option value="A Masculino">A Masculino</option>
          <option value="B Femenino">B Femenino</option>
          <option value="B Masculino">B Masculino</option>
          <option value="C Femenino">C Femenino</option>
          <option value="C Masculino">C Masculino</option>
          <option value="D Femenino">D Femenino</option>
          <option value="D Masculino">D Masculino</option>
          <option value="E Mezclado">E Mezclado</option>
          <option value="Baobá Femenino">Baobá Femenino</option>
          <option value="Baobá Masculino">Baobá Masculino</option>
          <option value="Juvenil Femenino">Juvenil Femenino</option>
          <option value="Juvenil Masculino">Juvenil Masculino</option>
          <option value="Infantil">Infantil</option>
          <option value="General">General</option>
        </select>

        <label for="stage">Fase:</label>
        <select id="stage" name="stage" required>
          <option value="Eliminatorias">Eliminatorias</option>
          <option value="Octavas">Octavas</option>
          <option value="Semifinales">Semifinales</option>
          <option value="Finales">Finales</option>
        </select>

        <h3>Puntuación del Jogo</h3>
        <label for="score1">Juez 1 (0–5):</label>
        <input type="number" step="0.1" min="0" max="5" id="score1" name="score1" required>

        <label for="score2">Juez 2 (0–5):</label>
        <input type="number" step="0.1" min="0" max="5" id="score2" name="score2" required>

        <label for="score3">Juez 3 (0–5):</label>
        <input type="number" step="0.1" min="0" max="5" id="score3" name="score3" required>

        <h3>Penalización (quita)</h3>
        <label for="penalizedCompetitor">Restar puntos a:</label>
        <select id="penalizedCompetitor" name="penalizedCompetitor" required>
          <option value="none">— Ninguno —</option>
          <option value="competitor1">Competidor 1</option>
          <option value="competitor2">Competidor 2</option>
        </select>

        <label for="penalty1">Quita Juez 1:</label>
        <input type="number" step="0.1" min="0" id="penalty1" name="penalty1" value="0" required>

        <label for="penalty2">Quita Juez 2:</label>
        <input type="number" step="0.1" min="0" id="penalty2" name="penalty2" value="0" required>

        <label for="penalty3">Quita Juez 3:</label>
        <input type="number" step="0.1" min="0" id="penalty3" name="penalty3" value="0" required>

        <button type="submit">Añadir Puntuación</button>
      </form>
    </section>

    <!-- ── Sección 3: Tabla de resultados ───────────────────────────── -->
    <h2>Tabla de Puntuaciones</h2>
    <table>
      <thead>
        <tr>
          <th>Categoría</th>
          <th>Fase</th>
          <th>Competidor 1</th>
          <th>Competidor 2</th>
          <th>Nota Jogo</th>
          <th>Penalizado</th>
          <th>Total Comp. 1</th>
          <th>Total Comp. 2</th>
        </tr>
      </thead>
      <tbody id="scoreTableBody"></tbody>
    </table>

  </div>
  <script src="./script.js"></script>

  <!-- Registro del Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .catch(err => console.warn('Service Worker no registrado:', err));
      });
    }
  </script>
</body>
</html>
